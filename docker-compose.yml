services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: coraza-test-etcd
    command:
      - etcd
      - --name=etcd0
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
    ports:
      - "2379:2379"
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 3s
      timeout: 3s
      retries: 10

  apisix:
    build:
      context: ./apisix
    container_name: coraza-test-apisix
    depends_on:
      etcd:
        condition: service_healthy
    ports:
      - "9080:9080"   # data plane (HTTP)
      - "9180:9180"   # admin API
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml

  httpbin:
    image: mccutchen/go-httpbin:v2.15.0
    container_name: coraza-test-httpbin
    ports:
      - "8080:8080"

networks:
  default:
    name: coraza-test-net
